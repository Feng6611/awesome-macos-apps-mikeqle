name: Links

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # Some app sites refuse automated requests (403) or rate-limit (429); those aren't dead links.
          args: --no-progress --max-retries 3 --accept 200..=299,403,429 README.md CONTRIBUTING.md
          fail: true
